apiVersion: apps/v1
kind: Deployment
metadata:
  name: rogue-agent-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rogue-agent-app
  template:
    metadata:
      labels:
        app: rogue-agent-app
    spec:
      containers:
        - name: rogue-agent-app
          image: localhost/rogue-agent-app:local
          imagePullPolicy: Never
          env:
            - name: DIRECT_URL
              value: http://mock-llm-server:8787/v1/chat/completions
            - name: GATEWAY_URL
              value: http://agentgateway:4000/v1/chat/completions
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: rogue-agent-app
spec:
  type: LoadBalancer
  selector:
    app: rogue-agent-app
  ports:
    - port: 5173
      targetPort: 5173
